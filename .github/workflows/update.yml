name: update

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 h (UTC); GitHub may start it late under load
  workflow_dispatch:

permissions:
  contents: write   # push data to gh-pages
  actions: write    # re-enable this workflow so the 60-day inactivity rule never stops the schedule

concurrency:
  group: update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check out gh-pages into site/
        run: |
          git fetch --depth=1 origin gh-pages
          git worktree add -B gh-pages site FETCH_HEAD

      - name: Fetch forecasts, write data, send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 backend/snowscout.py --out site

      # runs even if the alert failed, so the watch still gets fresh data
      - name: Publish to gh-pages
        if: ${{ !cancelled() }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin gh-pages

      - name: Keep the schedule alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/update.yml/enable"
